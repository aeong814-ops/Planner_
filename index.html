<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도토리 미니홈피 - 기말고사 계획표</title>
<style>
@font-face{font-family:'DOSGothic';src:url(DOSGothic.woff) format('woff');font-display:swap}
@font-face{font-family:'DOSIyagi';src:url(DOSIyagiBoldface.woff) format('woff');font-display:swap}
:root{--blue:#5f8aa6;--orange:#e08a3c;--line:#a0b9ca;--txt:#444;--soft:#eef3f6;--bg:#e9e9eb;--grid:#d8d8dc;--cover:#ffffff;--cover-d:#d1d1d1;--stitch:#e0e0e0;--ctitle:#527590}
*{box-sizing:border-box}
html{font-synthesis:none}
body{margin:0;font-family:'DOSGothic','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--txt);font-size:16px;line-height:1.35;-webkit-font-smoothing:none;
 background-color:var(--bg);min-height:100vh}
body.pat-grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
body.pat-dots{background-image:radial-gradient(var(--grid) 2px,transparent 2.6px);background-size:22px 22px}
input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);vertical-align:middle;background:#fff;cursor:pointer}
.hd{font-family:'DOSIyagi','DOSGothic',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt)}
small{font-size:16px;color:#999}
.hidden{display:none!important}
/* login */
#login{max-width:360px;margin:10vh auto;background:#fff;border:2px solid var(--line);border-radius:16px;padding:26px;text-align:center;box-shadow:0 4px 0 #c9d4db}
#login h1{color:var(--blue);font-size:32px;margin:0 0 4px;font-weight:400}
#login p{margin:0 0 16px;color:#888}
#login input{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:8px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px}
.btn.o{background:var(--orange)} .btn.g{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.sm{padding:3px 9px}
.row{display:flex;gap:8px;margin-top:8px}.row .btn{flex:1}
#modebanner{background:#fff6e5;border:1px dashed var(--orange);border-radius:8px;padding:6px;margin-top:12px;color:#a56320}
/* top bar */
#app{max-width:1000px;margin:14px auto;padding:0 10px}
.side{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px;box-shadow:0 3px 0 #c9d4db}
.side b{color:var(--orange);font-weight:400}
.side .sp{flex:1}
.pl2{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:#f7f7f7;max-width:100%}
.ptitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.pbtn{border:1px solid #bbb;background:#fff;border-radius:3px;padding:0 8px}
/* book */
.book{position:relative;background:var(--cover);border:3px solid var(--cover-d);border-radius:22px;padding:22px 20px 20px;display:grid;grid-template-columns:204px 1fr 92px;gap:20px;box-shadow:0 5px 0 var(--cover-d)}
.book::before{content:'';position:absolute;inset:7px;border:2px dashed var(--stitch);border-radius:16px;pointer-events:none}
.counter{grid-column:1/4;display:flex;justify-content:flex-start;color:var(--ctitle);letter-spacing:1px;margin-bottom:-14px;padding:0 4px}
.ring{position:absolute;left:217px;width:34px;height:12px;border:2px solid #9aa7af;border-radius:8px;background:#f4f6f7;z-index:2}
.title{grid-column:1/4;margin:0;color:var(--ctitle);font-size:32px;font-weight:400;padding:0 4px;line-height:1.1}
.left,.main{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;min-height:540px}
.main{min-width:0}
.left .pic{border:1px solid var(--line);border-radius:6px;background:linear-gradient(#e8f0f6,#f8f1ea);padding:6px 20px 0}
.left .pic svg{width:100%;display:block}
.mood{border:1px solid var(--line);border-radius:6px;margin-top:8px;padding:3px 6px;display:flex;gap:6px;align-items:center}
.mood i{font-style:normal;color:var(--blue);font-size:16px}
.mood select{border:0;background:transparent;flex:1;min-width:0}
.left .msg{margin:10px 0;line-height:1.4;text-align:center;word-break:break-all}
.left .nm{font-size:16px;color:#333}.left .idl{color:#999}
.stat{display:flex;justify-content:space-between;border-top:1px dotted var(--line);margin-top:10px;padding-top:8px}
.stat b{color:var(--orange);font-weight:400}
.dbig{margin:10px 0;text-align:center;background:var(--soft);border-radius:10px;padding:6px;color:var(--blue);font-size:32px;line-height:1.1}
.tabs{display:flex;flex-direction:column;gap:5px;margin-top:40px;position:relative;z-index:3}
.tab{background:var(--blue);color:#fff;border:0;border-radius:0 10px 10px 0;padding:8px 2px;margin-right:-18px;text-align:center}
.tab.on{background:#fff;color:#333;border:2px solid var(--line);border-left:0}
h3.sec{color:var(--blue);margin:0 0 10px;border-bottom:2px solid var(--blue);padding-bottom:4px;font-size:16px}
.bl{color:var(--blue)}
.bl small{margin-left:4px;font-size:16px;letter-spacing:1px;color:#aab}
.box{border:1px dotted var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
ul.rec{list-style:none;padding:0;margin:6px 0 0}ul.rec li{padding:3px 0 3px 12px;position:relative}
ul.rec li::before{content:'';position:absolute;left:0;top:11px;width:5px;height:5px;background:#bbb}
.top2{display:grid;grid-template-columns:1fr 250px;gap:14px;margin-bottom:12px}
.sg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px}
.sg div{padding:5px 8px;border:1px solid #dbe3e8;color:var(--blue);display:flex;justify-content:space-between;gap:4px}
.sg b{color:#777;font-weight:400}
.bgm{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#f7fafc;margin-bottom:12px}
.bgm .ptitle{flex:1;max-width:none}
.td{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dotted #ccc}
.td.d{color:#aaa;text-decoration:line-through}
/* room */
.room{container-type:inline-size;position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#f1f4f6;touch-action:manipulation}
.room svg.rs{position:absolute;inset:0;width:100%;height:100%;display:block}
.ritem{position:absolute;transform:translate(-50%,-60%);font-size:8cqw;line-height:1;user-select:none}
.rchar{position:absolute;transform:translate(-50%,-96%);width:15cqw}.rchar svg{width:100%;display:block}
.room.edit .ritem,.room.edit .rchar{cursor:grab;touch-action:none;outline:1px dashed rgba(95,138,166,.6)}
.rm{position:absolute;top:-4px;right:-8px;background:#e55;color:#fff;border-radius:50%;width:5cqw;height:5cqw;font-size:3.6cqw;line-height:5cqw;text-align:center;font-style:normal}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1px solid #888;border-radius:4px;padding:1px 8px;white-space:nowrap;font-size:16px;z-index:200}
/* planner */
.pl{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
table.tk{width:100%;border-collapse:collapse}
table.tk td{border-bottom:1px solid #ccc;padding:3px 2px;vertical-align:middle}
table.tk input.t{width:100%;border:0;background:transparent;padding:5px 2px}
table.tk input.n{width:40px;border:1px solid #ddd;border-radius:4px;padding:2px;text-align:center}
.tk tr.done input.t{text-decoration:line-through;color:#aaa}
.tk tr.done{background:#fbf6ee}
.stamp{color:var(--orange);white-space:nowrap}
.cam{background:#fff;border:1px solid var(--orange);color:var(--orange);border-radius:6px;padding:2px 6px;white-space:nowrap}
.line{width:100%;border:0;border-bottom:1px solid #ccc;padding:6px 2px;background:transparent}
textarea.notes{width:100%;height:110px;border:1px solid #ccc;border-radius:6px;padding:6px;resize:vertical}
.tt{display:grid;grid-template-columns:52px 1fr}.tt span{color:#999;padding:6px 0;border-bottom:1px solid #ddd}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dnav b{flex:1;text-align:center;color:var(--blue);font-weight:400}
.lbl{color:#888;margin:10px 0 3px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;color:#888;padding:3px}
.cd{min-height:70px;border:1px solid #dde;border-radius:8px;padding:3px 4px;position:relative;cursor:pointer;background:#fff}
.cd em{display:block;font-style:normal;color:var(--blue);margin-top:2px}
.cd i{position:absolute;bottom:2px;right:4px;color:var(--orange);font-style:normal}
.cd.today{background:#fff6e5;border-color:var(--orange)}.cd.exam{background:#ffe3e3;border-color:#e55}.cd.exam em{color:#e33}
.cd.out{opacity:.35;cursor:default}
/* album, shop, posts */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid .ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.grid .ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.grid .ph div{padding:3px 5px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.si{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;background:#fff}
.si .e{font-size:30px}.si button{margin-top:3px}
.sw{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);margin:3px;cursor:pointer;vertical-align:middle;text-align:center;line-height:22px}
.sw.on{outline:3px solid var(--orange)}
input.f,textarea.f{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dotted #ccc}
.post{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
.post .ph2{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px dotted #ccc;padding-bottom:4px;margin-bottom:6px}
.post .pt{word-break:break-all;line-height:1.5}
.pimg{max-width:100%;max-height:260px;border-radius:8px;margin-top:6px;cursor:pointer;display:block}
.pv{max-width:140px;max-height:100px;border-radius:6px;margin-top:6px;display:block}
.outf{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.outf div{border:1px solid var(--line);border-radius:8px;padding:2px;cursor:pointer;background:linear-gradient(#e8f0f6,#f8f1ea)}
.outf div.on{outline:3px solid var(--orange)}.outf svg{width:100%;display:block}
.opts{display:flex;flex-wrap:wrap;gap:4px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#444;color:#fff;border-radius:20px;padding:8px 18px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:.95}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:8px;padding:12px}
#lb img{max-width:92vw;max-height:78vh;border-radius:10px;background:#fff}
#yt{position:fixed;width:200px;height:113px;left:-400px;top:0;pointer-events:none}
#yt.show{left:10px;top:auto;bottom:70px;z-index:90;pointer-events:auto;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#000}

@media(max-width:860px){
 .book{grid-template-columns:1fr}.title{grid-column:1}.ring{display:none}
 .left{min-height:0}.tabs{flex-direction:row;flex-wrap:wrap;margin:0;order:-1;grid-column:1}
 .tab{border-radius:10px;margin:0;flex:1;min-width:76px}.tab.on{border:2px solid var(--line)}
 .pl,.two,.top2{grid-template-columns:1fr}.counter{grid-column:1}
 .cd{min-height:56px}
}
 .ac{display:inline-block;width:1.05em;height:1.17em;vertical-align:-.24em;margin:0 1px}.ac svg{width:100%;height:100%;display:block}
.outf{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.outf div{text-align:center}.pc{display:block;font-size:14px;color:var(--orange);line-height:1.2;padding-bottom:2px}
</style>
</head>
<body class="pat-grid">

<div id="login">
  <h1 class="hd">🌰 도토리 미니홈피</h1>
  <p>기말고사 D-day 계획표</p>
  <input id="lid" placeholder="아이디 (2~16자)" autocomplete="username">
  <input id="lpin" placeholder="핀번호 (숫자 4자리)" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password">
  <div class="row"><button class="btn" id="bLogin">로그인</button><button class="btn o" id="bJoin">처음이에요(가입)</button></div>
  <div id="modebanner"></div>
</div>

<div id="app" class="hidden">
  <div class="side">
    <span>🌰 <b id="sAcorn">0</b></span>
    <span>⏳ <b id="sD">-</b></span>
    <span>✅ 오늘 <b id="sToday">0/0</b></span>

  </div>
  <div class="book">
    <div class="ring" style="top:90px"></div><div class="ring" style="top:150px"></div>
    <div class="ring" style="bottom:150px"></div><div class="ring" style="bottom:90px"></div>
    <div class="counter hd" id="counter"></div>
    <h2 class="title hd" id="bookTitle">미니홈피</h2>
    <div class="left" id="left"></div>
    <div class="main" id="content"></div>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div id="yt"></div>
<div id="toast"></div>

<script>
/* ================= 설정 ================= */
const CONFIG = {
  EXAM_DATE: '2026-11-26',          // 기말고사(디데이 기준일)
  SUPABASE_URL: 'https://yvidvwccvrssmubhubbz.supabase.co',                 // 비워두면 이 기기에서만 저장(로컬 모드)
  SUPABASE_KEY: 'sb_publishable_zuJONZNRGWYSOrlIGTt84A_aPKdak2J'                  // Supabase anon public key
};

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayS = () => ds(new Date());
const daysTo = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const untilExam = s => daysTo(s, CONFIG.EXAM_DATE);
const dLabel = n => n > 0 ? `D-${n}` : n === 0 ? 'D-DAY' : '';
const rid = () => Math.random().toString(36).slice(2, 8);
const safeImg = s => /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s || '') ? s : '';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ================= 저장소 (Supabase 또는 로컬) ================= */
const REMOTE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
async function sb(path, opt = {}) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    ...opt,
    headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY,
      'Content-Type': 'application/json', ...(opt.headers || {}) }
  });
  if (!r.ok) throw new Error(await r.text());
  return opt.method && opt.method !== 'GET' ? null : r.json();
}
const DB = REMOTE ? {
  async get(kind, id){ const r = await sb(`docs?kind=eq.${kind}&id=eq.${encodeURIComponent(id)}&select=data`); return r[0]?.data ?? null; },
  async set(kind, id, data){ await sb('docs', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ kind, id, data, updated_at: new Date().toISOString() }) }); },
  async del(kind, id){ await sb(`docs?kind=eq.${kind}&id=eq.${encodeURIComponent(id)}`, { method:'DELETE' }); },
  async list(kind, prefix){ const r = await sb(`docs?kind=eq.${kind}&id=like.${encodeURIComponent(prefix)}*&select=id&order=id.desc&limit=300`); return r.map(x => x.id).filter(i => i.startsWith(prefix)); }
} : {
  async get(kind, id){ const v = localStorage.getItem(`dt:${kind}:${id}`); return v ? JSON.parse(v) : null; },
  async set(kind, id, data){ try { localStorage.setItem(`dt:${kind}:${id}`, JSON.stringify(data)); } catch(e){ toast('저장 공간이 가득 찼어요 😢'); throw e; } },
  async del(kind, id){ localStorage.removeItem(`dt:${kind}:${id}`); },
  async list(kind, prefix){ const p = `dt:${kind}:`; return Object.keys(localStorage).filter(k => k.startsWith(p + prefix)).map(k => k.slice(p.length)); }
};

async function hashPin(id, pin){
  const s = 'dotori:' + id.toLowerCase() + ':' + pin;
  if (window.crypto?.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h;
}

/* ================= 카탈로그 ================= */
const ITEMS = [
 {id:'plant',e:'🪴',p:3,n:'화분'},{id:'flower',e:'🌸',p:2,n:'꽃'},{id:'lamp',e:'💡',p:4,n:'전등'},
 {id:'chair',e:'🪑',p:4,n:'의자'},{id:'sofa',e:'🛋️',p:8,n:'소파'},{id:'bed',e:'🛏️',p:10,n:'침대'},
 {id:'books',e:'📚',p:5,n:'책더미'},{id:'teddy',e:'🧸',p:6,n:'곰인형'},{id:'pic',e:'🖼️',p:5,n:'액자'},
 {id:'mirror',e:'🪞',p:6,n:'거울'},{id:'pc',e:'🖥️',p:9,n:'컴퓨터'},{id:'piano',e:'🎹',p:12,n:'피아노'},
 {id:'cloud',e:'☁️',p:3,n:'구름'},{id:'star',e:'⭐',p:2,n:'별'},{id:'candle',e:'🕯️',p:3,n:'초'},
 {id:'cat',e:'🐈',p:14,n:'고양이'},{id:'sq',e:'🐿️',p:15,n:'다람쥐'},{id:'tree',e:'🌳',p:7,n:'나무'}
];
const WALLS = [
 {id:'mint',n:'민트',c:'#cfe6dc',p:0,pat:'stripe'},{id:'sky',n:'하늘',c:'#cfe0f2',p:0,pat:''},{id:'pink',n:'핑크',c:'#f6d5dd',p:5,pat:'dots'},
 {id:'lemon',n:'레몬',c:'#f8ecb8',p:5,pat:'stripe'},{id:'lav',n:'라벤더',c:'#ddd5f2',p:8,pat:'dots'}
];
const FLOORS = [
 {id:'check',n:'체크',p:0,t:'check',a:'#ffffff',b:'#dfe6ec'},
 {id:'wood',n:'우드',p:5,t:'wood',a:'#e8c9a0',b:'#d2a877'},
 {id:'grass',n:'잔디',p:6,t:'grass',a:'#d3ebc6',b:'#a9d495'},
 {id:'tile',n:'핑크타일',p:6,t:'check',a:'#fde9ee',b:'#f5c9d5'}
];
const swCSS = f => f.t === 'wood' ? `repeating-linear-gradient(90deg,${f.a} 0 6px,${f.b} 6px 8px)` : f.t === 'grass' ? `radial-gradient(${f.b} 20%,transparent 22%) 0 0/8px 8px,${f.a}` : `repeating-conic-gradient(${f.a} 0 25%,${f.b} 0 50%) 0 0/12px 12px`;
const MOODS = ['😊 기분 좋음','📚 열공 중','😴 졸려요','😭 시험 무서워','🍀 파이팅','🍙 배고픔','🎧 노래 듣는 중'];

/* ================= 픽셀 캐릭터 ================= */
const SKINS = ['#ffe6d5','#fbd5bd','#eebb98','#c98f66'];

  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes('🌰') && n.parentNode && !/^(TEXTAREA|SCRIPT|STYLE|OPTION|TITLE)$/.test(n.parentNode.nodeName) ? 1 : 3 });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => {
    const f = document.createDocumentFragment();
    n.nodeValue.split('🌰').forEach((t, i) => { if (i) { const a = document.createElement('span'); a.className = 'ac'; a.innerHTML = AC_SVG; f.appendChild(a); } if (t) f.appendChild(document.createTextNode(t)); });
    n.parentNode.replaceChild(f, n);
  });

const HEX = [[12,34],[80,0],[148,34],[148,62],[80,96],[12,62]];
const inPoly = (x, y, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c; } return c; };
function clampItem(x, y){
  const X = x * 1.6; if (inPoly(X, y, HEX)) return [x, y];
  for (let k = 1; k <= 40; k++) { const t = 1 - k * .025, xx = 80 + (X - 80) * t, yy = 48 + (y - 48) * t; if (inPoly(xx, yy, HEX)) return [xx / 1.6, yy]; }

}
function clampChar(x, y){
  const dx = (x - 50) / 37, dy = (y - 62) / 29, s = Math.abs(dx) + Math.abs(dy);
  return s <= 1 ? [x, y] : [50 + (x - 50) / s, 62 + (y - 62) / s];
}

}

function enableDrag(){
  const room = $('#room'); let cur = null;
  const pos = (e, b) => [(e.clientX - b.left) / b.width * 100, (e.clientY - b.top) / b.height * 100];
  room.addEventListener('pointerdown', e => {
    if (e.target.dataset.rm) { profile.room.items = profile.room.items.filter(i => i.uid !== e.target.dataset.rm); saveProfile(); decor(); return; }
    const el = e.target.closest('.ritem,.rchar'); if (!el) return;
    const [px, py] = pos(e, room.getBoundingClientRect());
    cur = el; cur._x = null; cur._ox = parseFloat(el.style.left) - px; cur._oy = parseFloat(el.style.top) - py;
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  room.addEventListener('pointermove', e => {
    if (!cur) return; const [px, py] = pos(e, room.getBoundingClientRect());
    let x = px + cur._ox, y = py + cur._oy;
    [x, y] = cur.classList.contains('rchar') ? clampChar(x, y) : clampItem(x, y);
    cur.style.left = x + '%'; cur.style.top = y + '%'; cur.style.zIndex = Math.round(y); cur._x = x; cur._y = y;
  });
  const end = () => {
    if (!cur) return;
    if (cur._x != null) {
      if (cur.classList.contains('rchar')) { profile.room.cx = cur._x; profile.room.cy = cur._y; }
      else { const it = profile.room.items.find(i => i.uid === cur.dataset.uid); if (it) { it.x = cur._x; it.y = cur._y; } }
      saveProfile();
    }
    cur = null;
  };
  room.addEventListener('pointerup', end); room.addEventListener('pointercancel', end);
}

    const t = plan.tasks[camIdx];

      await DB.set('photo', `${me}/${pk}`, { img, text: t.t, date: d });
      t.done = true; t.pk = pk; t.doneAt = Date.now(); record.acorns++;
      await DB.set('record', me, record); refreshSide(); toast('🌰 도토리 +1 ! 잘했어요'); renderShell(); diary();

  };
}
function shiftDay(n){ const x = pd(planDate); x.setDate(x.getDate() + n); planDate = ds(x); diary(); }
function compress(file, max = 640, q = .65){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

  <div style="padding-top:6px">${esc(p.mood || '')} · ${esc(p.msg)}</div></div>
  <div class="hd bl">${esc(p.name)}님의 다이어리</div><div id="vp" style="margin-top:6px">불러오는 중...</div>
  <button class="btn g" onclick="go('friends')">← 친구 목록</button>`);
  bindLB($('#content'));
  const b = $('#vb'); if (b) b.onclick = () => startBGM(p.bgm);
  if (playing && p.bgm.url) startBGM(p.bgm);
  friendPosts(v.id, 10).then(r => {
    const el = $('#vp'); if (!el) return;
    if (!r) el.textContent = '불러오지 못했어요';
    else if (r.locked) el.innerHTML = '<span style="color:#aaa">🔒 이 친구가 나를 친구로 추가하면 다이어리를 볼 수 있어요</span>';
    else el.innerHTML = r.posts.map(x => postHTML(x)).join('') || '<span style="color:#aaa">아직 쓴 글이 없어요</span>';
  }).catch(() => { const el = $('#vp'); if (el) el.textContent = '불러오지 못했어요'; });
}

/* ================= 프로필 ================= */
function prof(){
  const c = profile.char, th = profile.theme;
    const owned = (k, v) => !priceOf(k, v) || record.owned.includes(k + ':' + v);
  const tag = (k, v) => owned(k, v) ? '' : ` 🔒🌰${priceOf(k, v)}`;
  const sw = (key, list) => list.map(v => `<span class="sw ${c[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}" style="background:${v}" title="${owned(key, v) ? '' : '도토리 ' + priceOf(key, v) + '개'}">${owned(key, v) ? '' : '🔒'}</span>`).join('');
  const op = (key, list) => list.map(([v, n]) => `<button class="btn sm ${c[key] === v ? '' : 'g'}" data-k="${key}" data-v="${v}">${n}${tag(key, v)}</button>`).join(' ');
  const tg = (key, label) => `<button class="btn sm ${c[key] ? '' : 'g'}" data-k="${key}" data-v="${c[key] ? '0' : '1'}">${label}${c[key] ? '' : tag(key, '1')}</button>`;
  C(`<h3 class="sec hd">프로필 · 내 캐릭터 <span style="color:var(--orange)">🌰 ${record.acorns}</span></h3>
  <p style="color:#888;margin:0 0 6px">🔒는 도토리로 살 수 있어요. 한 번 사면 계속 쓸 수 있어요.</p>
  <div class="two"><div class="box" style="text-align:center;background:linear-gradient(#e8f0f6,#f8f1ea)"><div style="width:150px;margin:auto">${charSVG(c)}</div></div>
  <div><div class="lbl" style="margin-top:0">피부</div>${sw('skin', SKINS)}<div class="lbl">머리색</div>${sw('hair', HAIRS)}
   <div class="lbl">머리모양</div><div class="opts">${op('hs', HAIRSTYLES)}</div><div class="lbl">앞머리</div><div class="opts">${op('bang', BANGS)}</div>
   <div class="lbl">눈</div>${sw('eye', EYES)} <span class="opts" style="display:inline-flex">${tg('shut', c.shut ? '감은 눈' : '뜬 눈')}</span></div></div>
  <div class="lbl">옷</div><div class="outf">${OUTFITS.map((o, i) => `<div class="${c.outfit === i ? 'on' : ''}" data-k="outfit" data-v="${i}" title="${o.n}">${charSVG({ ...c, outfit: i, bear: false, bunny: false })}<span class="pc">${o.n}<br>${owned('outfit', i) ? '✓' : '🌰' + o.p}</span></div>`).join('')}</div>
  <div class="two"><div><div class="lbl">모자</div><div class="opts">${op('hat', HATS)}</div><div class="lbl">모자/머리띠 색</div>${sw('hatc', HATC)}</div>
  <div><div class="lbl">머리핀</div><div class="opts">${op('clip', CLIPS)}</div><div class="lbl">소품</div><div class="opts">${tg('glasses', c.glasses ? '안경 ON' : '안경')} ${tg('bear', c.bear ? '곰인형 ON' : '곰인형')} ${tg('bunny', c.bunny ? '토끼인형 ON' : '토끼인형')}</div></div></div>
  <div class="two"><div><div class="lbl">모자</div><div class="opts">${op('hat', HATS)}</div><div class="lbl">모자/머리띠 색</div>${sw('hatc', HATC)}</div>
  <div><div class="lbl">머리핀</div><div class="opts">${op('clip', CLIPS)}</div><div class="lbl">소품</div><div class="opts">${tg('glasses', c.glasses ? '안경 ON' : '안경 OFF')} ${tg('bear', c.bear ? '곰인형 ON' : '곰인형 OFF')}</div></div></div>
  <h3 class="sec hd" style="margin-top:16px">페이지 색 꾸미기</h3>
  <div class="lbl" style="margin-top:0">추천 색 조합</div>
  <div class="opts">${THEMES.map(([n, t], i) => `<button class="btn sm g" data-tp="${i}" style="border-color:${t.accent}"><span style="display:inline-block;width:12px;height:12px;background:${t.cover};border:1px solid ${t.accent};vertical-align:-1px"></span> ${n}</button>`).join(' ')}</div>
  <div class="lbl">직접 고르기</div>
  <div class="opts"><label>표지 <input type="color" data-tc="cover" value="${th.cover}"></label> <label>배경 <input type="color" data-tc="bg" value="${th.bg}"></label> <label>포인트 <input type="color" data-tc="accent" value="${th.accent}"></label></div>
  <div class="lbl">배경 무늬</div><div class="opts">${PATS.map(([v, n]) => `<button class="btn sm ${th.pat === v ? '' : 'g'}" data-tpat="${v}">${n}</button>`).join(' ')}</div>
  <div class="lbl">이름(별명)</div><input class="f" id="pn" maxlength="12" value="${esc(profile.name)}">
  <div class="lbl">한 줄 소개</div><textarea class="f" id="pm" maxlength="60" rows="2">${esc(profile.msg)}</textarea>
  <button class="btn" id="ps">저장</button>`);
  $('#content').oninput = e => { const k = e.target.dataset.tc; if (!k) return; profile.theme[k] = e.target.value; applyTheme(profile.theme); saveProfile(); };
  $('#content').onclick = e => {
    const tp = e.target.closest('[data-tp]'), pt = e.target.closest('[data-tpat]');
    if (tp) { profile.theme = normTheme({ ...profile.theme, ...THEMES[+tp.dataset.tp][1] }); applyTheme(profile.theme); saveProfile(); prof(); renderShell(); return; }
    if (pt) { profile.theme.pat = pt.dataset.tpat; applyTheme(profile.theme); saveProfile(); prof(); return; }
    const t = e.target.closest('[data-k]'); if (!t) return; const k = t.dataset.k, v = t.dataset.v;
    const pr = priceOf(k, v), key = k + ':' + v;
    if (pr && !record.owned.includes(key)) {
      if (record.acorns < pr) return toast('도토리가 부족해요 🌰');
      if (!confirm(`도토리 ${pr}개로 살까요?`)) return;
      record.acorns -= pr; record.owned.push(key); saveRecord(); toast('구입했어요!');
    }
    c[k] = k === 'outfit' ? +v : (k === 'glasses' || k === 'bear' || k === 'bunny' || k === 'shut') ? v === '1' : v;
    profile.char = normChar(c); saveProfile(); prof(); renderShell();
  };
  $('#ps').onclick = () => { profile.name = $('#pn').value.trim() || me; profile.msg = $('#pm').value.trim(); saveProfile(); renderShell(); toast('저장했어요 ✨'); };
}
 pixelize(document.body);
new MutationObserver(ms => ms.forEach(m => { m.addedNodes.forEach(n => pixelize(n.nodeType === 1 ? n : n.parentNode)); if (m.type === 'characterData') pixelize(m.target.parentNode); })).observe(document.body, { childList: true, subtree: true, characterData: true });
</script>
</body>
</html>
