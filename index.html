const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
let timeOff = 0;

  try {
    const r = await fetch(location.pathname + '?_t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const h = r.headers.get('Date'), t = h ? new Date(h).getTime() : NaN;
    if (!isNaN(t)) { timeOff = t - Date.now(); return true; }
  } catch (e) {}

/* ================= 저장소 (Supabase 또는 로컬) ================= */
const REMOTE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
async function sb(path, opt = {}) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    ...opt,
    headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY,

  });
  if (!r.ok) throw new Error(await r.text());
  return opt.method && opt.method !== 'GET' ? null : r.json();

const DB = REMOTE ? {
  async get(kind, id){ const r = await sb(`docs?kind=eq.${kind}&id=eq.${encodeURIComponent(id)}&select=data`); return r[0]?.data ?? null; },

function shiftDay(n){ const x = pd(planDate); x.setDate(x.getDate() + n); planDate = ds(x); diary(); }
function compress(file, max = 640, q = .65){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

  if (x.t === 'pager') return `📟 삐삐가 왔어요<br><b style="font-family:monospace;letter-spacing:2px;font-size:18px">${esc(x.text)}</b>${PAGER_CODES[x.text] ? ` <small style="color:#888">(${esc(PAGER_CODES[x.text])})</small>` : ''}`;
  if (x.t === 'cmt') return `💬 내 다이어리 글에 댓글을 남겼어요<br><span style="color:#888">“${esc(x.text)}”</span>`;
  if (x.t === 'guest') return `📖 내 방명록에 글을 남겼어요<br><span style="color:#888">“${esc(x.text)}”</span>`;

}

const PAGER_CODES = {'486':'사랑해','1004':'천사','8282':'빨리빨리','1010235':'열렬히 사모','7942':'친구사이','337':'힘내! (짝짝짝)'};
let pgBuf = '', pgTo = '';
function beep(f, d){
  try { const a = beep.a || (beep.a = new (window.AudioContext || window.webkitAudioContext)()), o = a.createOscillator(), g = a.createGain(); o.frequency.value = f || 880; g.gain.value = .04; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (d || .06)); } catch (e) {}
}
function pagerPage(){
  record.inbox = record.inbox || [];

  ${record.friends.length ? `<div class="pgr">
    <div class="lcd"><small id="pgTo"></small><b id="pgBuf"></b><small id="pgMean"></small></div>

  <div class="row" style="max-width:300px;margin:8px auto"><select class="f" id="pgSel" style="margin:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px">${record.friends.map(f => `<option value="${esc(f)}" ${f === pgTo ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>
  <div class="opts" style="justify-content:center;margin-bottom:10px">${Object.entries(PAGER_CODES).map(([k, v]) => `<button class="btn g sm" data-q="${k}">${k} · ${esc(v)}</button>`).join('')}</div>` : '<p style="color:#aaa">먼저 친구를 추가해 보세요</p>'}
  <div class="hd bl">받은 삐삐</div>
  <div class="pgr" style="margin-top:8px"><div class="lcd" style="min-height:40px">${rec.map(x => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.from)}</span><b style="font-size:16px">${esc(x.text)}</b></div>${PAGER_CODES[x.text] ? `<small>→ ${esc(PAGER_CODES[x.text])}</small>` : ''}`).join('') || '<small>받은 삐삐가 없어요</small>'}</div></div>`);
  const lcd = () => { const t = $('#pgTo'); if (!t) return; t.textContent = pgTo ? `TO ${pgTo}` : ''; $('#pgBuf').textContent = pgBuf || '_'; $('#pgMean').textContent = PAGER_CODES[pgBuf] ? `→ ${PAGER_CODES[pgBuf]}` : ' '; };
  lcd();
  const sel = $('#pgSel'); if (sel) sel.onchange = () => { pgTo = sel.value; lcd(); };
  $('#content').onclick = e => {
    const k = e.target.closest('[data-k]'), q = e.target.closest('[data-q]');
    if (q) { pgBuf = q.dataset.q; beep(1000); lcd(); return; }
    if (!k) return; const v = k.dataset.k;

      if (!pgTo) return toast('받을 친구를 골라 주세요'); if (!pgBuf) return toast('숫자를 먼저 눌러 주세요');

    lcd();
  };
}

async function guestList(host){

  return rows.filter(Boolean);
}

  const p = v.profile; p.bgm = p.bgm || { url: '', title: '' }; p.room = Object.assign({ wall: 'mint', floor: 'check', items: [], cx: 50, cy: 70 }, p.room);
  C(`<h3 class="sec hd">${esc(p.name)}님의 방에 놀러 왔어요 🏠</h3>${roomHTML(p, false)}
  <div class="box" style="margin-top:10px"><div class="fl"><span>🎵 ${esc(p.bgm.title || (p.bgm.url ? '배경음악' : '노래 없음'))}</span>${p.bgm.url ? '<button class="btn sm" id="vb">이 노래 듣기</button>' : ''}</div>
  <div style="padding-top:6px">${esc(p.mood || '')} · ${esc(p.msg)}</div></div>
    ${visitPL(p)}
  <div class="hd bl">${esc(p.name)}님의 다이어리</div><div id="vp" style="margin-top:6px">불러오는 중...</div>
    <div class="hd bl" style="margin-top:12px">${esc(p.name)}님의 방명록</div><div id="gb" style="margin-top:6px"></div>
    <div class="row"><button class="btn g" onclick="go('friends')">← 친구 목록</button><button class="btn o" onclick="wave()">🌊 파도타기</button></div>`);

  bindLB($('#content'));
  const b = $('#vb'); if (b) b.onclick = () => startBGM(p.bgm);
   document.querySelectorAll('[data-vp]').forEach(x => x.onclick = () => startBGM(p.pl[x.dataset.vp]));
   watchRoom(v.id);
   renderGuest(v.id, $('#gb'));
  if (playing && p.bgm.url) startBGM(p.bgm);
  friendPosts(v.id, 10).then(r => {
    const el = $('#vp'); if (!el) return;
    if (!r) el.textContent = '불러오지 못했어요';
    else if (r.locked) el.innerHTML = '<span style="color:#aaa">🔒 이 친구가 나를 친구로 추가하면 다이어리를 볼 수 있어요</span>';
    else el.innerHTML = r.posts.map(x => postHTML(x)).join('') || '<span style="color:#aaa">아직 쓴 글이 없어요</span>';
  }).catch(() => { const el = $('#vp'); if (el) el.textContent = '불러오지 못했어요'; });
}

/* ================= 프로필 ================= */
/* ================= 옷장 ================= */
let cTab = 'outfit';
function closet(){
  const c = profile.char;
  const owned = (k, v) => !priceOf(k, v) || record.owned.includes(k + ':' + v);
  const tag = (k, v) => owned(k, v) ? '' : ` 🔒🌰${priceOf(k, v)}`;
  const sw = (key, list) => list.map(v => `<span class="sw ${c[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}" style="background:${v}" title="${owned(key, v) ? '' : '도토리 ' + priceOf(key, v) + '개'}">${owned(key, v) ? '' : '🔒'}</span>`).join('');
  const op = (key, list) => list.map(([v, n]) => `<button class="btn sm ${c[key] === v ? '' : 'g'}" data-k="${key}" data-v="${v}">${n}${tag(key, v)}</button>`).join(' ');
  const tg = (key, label) => `<button class="btn sm ${c[key] ? '' : 'g'}" data-k="${key}" data-v="${c[key] ? '0' : '1'}">${label}${c[key] ? '' : tag(key, '1')}</button>`;
  const CT = [['outfit', '옷'], ['hair', '머리'], ['face', '얼굴'], ['acc', '악세서리']];
  const body = cTab === 'outfit'
    ? `<div class="outf">${OUTFITS.map((o, i) => `<div class="${c.outfit === i ? 'on' : ''}" data-k="outfit" data-v="${i}" title="${o.n}">${charSVG({ ...c, outfit: i, bear: false, bunny: false })}<span class="pc">${o.n}<br>${owned('outfit', i) ? '✓' : '🌰' + o.p}</span></div>`).join('')}</div>`
    : cTab === 'hair'
    ? `<div class="lbl" style="margin-top:0">머리모양</div><div class="opts">${op('hs', HAIRSTYLES)}</div><div class="lbl">앞머리</div><div class="opts">${op('bang', BANGS)}</div><div class="lbl">머리색</div>${sw('hair', HAIRS)}`
    : cTab === 'face'
    ? `<div class="lbl" style="margin-top:0">피부</div>${sw('skin', SKINS)}<div class="lbl">눈 색</div>${sw('eye', EYES)}<div class="lbl">눈 모양</div><div class="opts">${tg('shut', c.shut ? '감은 눈' : '뜬 눈')}</div>`
    : `<div class="lbl" style="margin-top:0">모자</div><div class="opts">${op('hat', HATS)}</div><div class="lbl">모자/머리띠 색</div>${sw('hatc', HATC)}<div class="lbl">머리핀</div><div class="opts">${op('clip', CLIPS)}</div><div class="lbl">소품</div><div class="opts">${tg('glasses', c.glasses ? '안경 ON' : '안경')} ${tg('bear', c.bear ? '곰인형 ON' : '곰인형')} ${tg('bunny', c.bunny ? '토끼인형 ON' : '토끼인형')}</div>`;
  C(`<h3 class="sec hd">옷장 👗 <span style="color:var(--orange)">🌰 ${record.acorns}</span></h3>
  <p style="color:#888;margin:0 0 6px">🔒는 도토리로 살 수 있어요. 한 번 사면 계속 쓸 수 있어요.</p>
  <div class="box" style="text-align:center;background:linear-gradient(#e8f0f6,#f8f1ea)"><div style="width:130px;margin:auto">${charSVG(c)}</div></div>
  <div class="opts" style="margin-bottom:10px">${CT.map(([k, n]) => `<button class="btn ${cTab === k ? '' : 'g'}" data-ct="${k}" style="flex:1">${n}</button>`).join('')}</div>
  ${body}`);
  $('#content').onclick = e => {
    const ct = e.target.closest('[data-ct]'); if (ct) { cTab = ct.dataset.ct; closet(); return; }
    const t = e.target.closest('[data-k]'); if (!t) return; const k = t.dataset.k, v = t.dataset.v;
    const pr = priceOf(k, v), key = k + ':' + v;
    if (pr && !record.owned.includes(key)) {
      if (record.acorns < pr) return toast('도토리가 부족해요 🌰');
      if (!confirm(`도토리 ${pr}개로 살까요?`)) return;
      record.acorns -= pr; record.owned.push(key); saveRecord(); toast('구입했어요!');
    }
    c[k] = k === 'outfit' ? +v : (k === 'glasses' || k === 'bear' || k === 'bunny' || k === 'shut') ? v === '1' : v;
    profile.char = normChar(c); saveProfile(); closet(); renderShell();
  };
}

/* ================= 프로필 ================= */
function prof(){
  const th = profile.theme;
  C(`<h3 class="sec hd">프로필</h3>
  <div class="lbl" style="margin-top:0">이름(별명)</div><input class="f" id="pn" maxlength="12" value="${esc(profile.name)}">
  <div class="lbl">상태메시지</div><input class="f" id="pst" maxlength="30" value="${esc(profile.status || '')}" placeholder="상태메시지를 적어 보세요">
  <div class="lbl">한 줄 소개</div><textarea class="f" id="pm" maxlength="60" rows="2">${esc(profile.msg)}</textarea>
  <button class="btn" id="ps">저장</button>
  <h3 class="sec hd" style="margin-top:16px">디데이 설정</h3>
  <div class="lbl" style="margin-top:0">디데이 이름</div><input class="f" id="ddt" maxlength="12" value="${esc(ddTitle())}" placeholder="예: 기말고사, 수능, 여행">
  <div class="lbl">날짜</div><input class="f" id="ddd" type="date" value="${esc(examDate())}">
  <div class="row"><button class="btn" id="dds">디데이 저장</button><button class="btn g" id="ddr">기본값으로</button></div>
  <div class="lbl">추가 디데이 (최대 10개)</div>
  <div id="ddl">${(profile.ddays || []).map(x => `<div class="fl"><span>${esc(x.title)} <small>${esc(x.date)} · ${ddText(daysTo(todayS(), x.date))}</small></span><span><button class="btn sm" data-ddmain="${esc(x.id)}">대표로</button> <button class="btn g sm" data-dddel="${esc(x.id)}">삭제</button></span></div>`).join('') || '<span style="color:#aaa">아직 없어요</span>'}</div>
  <div class="row"><input class="f" id="ddt2" maxlength="12" placeholder="이름 (예: 생일, 여행)" style="margin:0;min-width:0"><input class="f" id="ddd2" type="date" style="margin:0;min-width:0"><button class="btn o" id="dda" style="flex:0 0 64px">추가</button></div>
  <h3 class="sec hd" style="margin-top:16px">페이지 색 꾸미기</h3>
  <div class="lbl" style="margin-top:0">추천 색 조합</div>
  <div class="opts">${THEMES.map(([n, t], i) => `<button class="btn sm g" data-tp="${i}" style="border-color:${t.accent}"><span style="display:inline-block;width:12px;height:12px;background:${t.cover};border:1px solid ${t.accent};vertical-align:-1px"></span> ${n}</button>`).join(' ')}</div>
  <div class="lbl">직접 고르기</div>
  <div class="opts"><label>표지 <input type="color" data-tc="cover" value="${th.cover}"></label> <label>배경 <input type="color" data-tc="bg" value="${th.bg}"></label> <label>포인트 <input type="color" data-tc="accent" value="${th.accent}"></label></div>
  <div class="lbl">배경 무늬</div><div class="opts">${PATS.map(([v, n]) => `<button class="btn sm ${th.pat === v ? '' : 'g'}" data-tpat="${v}">${n}</button>`).join(' ')}</div>`);
  $('#content').oninput = e => { const k = e.target.dataset.tc; if (!k) return; profile.theme[k] = e.target.value; applyTheme(profile.theme); saveProfile(); };
  $('#content').onclick = e => {
    const tp = e.target.closest('[data-tp]'), pt = e.target.closest('[data-tpat]');
    if (tp) { profile.theme = normTheme({ ...profile.theme, ...THEMES[+tp.dataset.tp][1] }); applyTheme(profile.theme); saveProfile(); prof(); renderShell(); return; }
    if (pt) { profile.theme.pat = pt.dataset.tpat; applyTheme(profile.theme); saveProfile(); prof(); return; }
  };
  $('#ps').onclick = () => { profile.name = $('#pn').value.trim() || me; profile.status = $('#pst').value.trim(); profile.msg = $('#pm').value.trim(); saveProfile(); renderShell(); toast('저장했어요 ✨'); };
  $('#dds').onclick = () => {
    const date = $('#ddd').value, title = $('#ddt').value.trim() || '디데이';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('날짜를 골라 주세요');
    profile.dday = { title, date }; const dd = pd(date); calMonth = new Date(dd.getFullYear(), dd.getMonth(), 1);
    saveProfile(); renderShell(); toast('디데이를 바꿨어요 📅');
  };
  $('#ddr').onclick = () => { delete profile.dday; calMonth = new Date(2026, 10, 1); saveProfile(); renderShell(); prof(); toast('기본값으로 돌렸어요'); };
  $('#dda').onclick = () => {
    const title = $('#ddt2').value.trim(), date = $('#ddd2').value;
    if (!title) return toast('이름을 적어 주세요');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('날짜를 골라 주세요');
    profile.ddays = profile.ddays || [];
    if (profile.ddays.length >= 10) return toast('최대 10개까지 추가할 수 있어요');
    profile.ddays.push({ id: rid(), title, date }); saveProfile(); renderShell(); prof(); toast('디데이를 추가했어요 📅');
  };
  $('#ddl').onclick = e => {
    const dm = e.target.closest('[data-ddmain]'), dx = e.target.closest('[data-dddel]'), list = profile.ddays || [];
    if (dx) { profile.ddays = list.filter(x => x.id !== dx.dataset.dddel); saveProfile(); renderShell(); prof(); }
    if (dm) {
      const x = list.find(v => v.id === dm.dataset.ddmain); if (!x) return;
      const old = profile.dday; profile.ddays = list.filter(v => v !== x);
      if (old) profile.ddays.push({ id: rid(), title: old.title, date: old.date });
      profile.dday = { title: x.title, date: x.date }; saveProfile(); renderShell(); prof(); toast('대표 디데이로 바꿨어요');
    }
  };
}
 pixelize(document.body);
new MutationObserver(ms => ms.forEach(m => { m.addedNodes.forEach(n => pixelize(n.nodeType === 1 ? n : n.parentNode)); if (m.type === 'characterData') pixelize(m.target.parentNode); })).observe(document.body, { childList: true, subtree: true, characterData: true });
</script>
</body>
